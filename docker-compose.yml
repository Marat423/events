services:
  db:
    image: postgres:15
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/events_db
      CLIENT_HOST: https://student-system-events-provider-web.student-system-events-provider.svc:8000
      EVENTS_API_KEY: ${EVENTS_API_KEY}
      PORT: 8000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/events_db


volumes:
  postgres_data:
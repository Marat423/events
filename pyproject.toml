[project]
name = "eventsaggregator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
